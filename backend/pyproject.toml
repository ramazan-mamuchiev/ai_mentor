[project]
name = "ai-mentor-backend"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not smoke'"
markers = [
    "smoke: slow tests with real embedding model (run explicitly with '-m smoke')",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
