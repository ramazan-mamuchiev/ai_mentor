# Redirect HTTP -> HTTPS (tvoydonor.by)
server {
    listen 80;
    server_name tvoydonor.by www.tvoydonor.by;
    return 301 https://tvoydonor.by$request_uri;
}

# Redirect www -> non-www over HTTPS
server {
    listen 443 ssl http2;
    server_name www.tvoydonor.by;

    ssl_certificate     /etc/nginx/ssl/tvoydonor.by.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/tvoydonor.by.key;

    return 301 https://tvoydonor.by$request_uri;
}

# Main HTTPS server (tvoydonor.by)
server {
    listen 443 ssl http2;
    server_name tvoydonor.by;

    ssl_certificate     /etc/nginx/ssl/tvoydonor.by.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/tvoydonor.by.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    root /opt/yourdonor/website;
    index index.html;

    # API requests -> Flask/gunicorn
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Static files served by Nginx
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
