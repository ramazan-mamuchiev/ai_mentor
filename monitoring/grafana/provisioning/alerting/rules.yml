apiVersion: 1

groups:
  - orgId: 1
    name: AI Mentor Alerts
    folder: AI Mentor
    interval: 1m
    rules:
      - uid: ai-mentor-high-error-rate
        title: "High Error Rate (>5% 5xx)"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              expr: 'sum(count_over_time({container="/ai-mentor-api-1", logger="access"} | json | status_code >= 500 [5m]))'
              queryType: instant
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              expr: 'sum(count_over_time({container="/ai-mentor-api-1", logger="access"} | json [5m]))'
              queryType: instant
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: math
              expression: "($A / $B) * 100 > 5"
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "Error rate exceeds 5% (5xx responses)"
          description: "The API is returning more than 5% server errors over the last 5 minutes."
        labels:
          severity: critical

      - uid: ai-mentor-high-latency
        title: "High Latency (p95 > 10s)"
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              expr: 'quantile_over_time(0.95, {container="/ai-mentor-api-1", logger="access"} | json | unwrap duration_ms [5m]) by () > 10000'
              queryType: instant
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "p95 response time exceeds 10 seconds"
          description: "The 95th percentile response time has been above 10s for 5 minutes."
        labels:
          severity: warning

      - uid: ai-mentor-db-pool-saturation
        title: "DB Pool Saturation (>80%)"
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              expr: 'last_over_time({container="/ai-mentor-api-1", logger="system"} | json | unwrap db_pool_checked_out [5m]) by () / last_over_time({container="/ai-mentor-api-1", logger="system"} | json | unwrap db_pool_size [5m]) by () > 0.8'
              queryType: instant
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "Database connection pool is over 80% utilized"
          description: "The PostgreSQL connection pool has been above 80% capacity for 5 minutes."
        labels:
          severity: warning

      - uid: ai-mentor-service-down
        title: "Service Down (no logs 5m)"
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              expr: 'absent_over_time({container="/ai-mentor-api-1"} [5m])'
              queryType: instant
        noDataState: Alerting
        execErrState: Error
        for: 5m
        annotations:
          summary: "AI Mentor API appears to be down"
          description: "No logs received from the API container for 5 minutes."
        labels:
          severity: critical

      - uid: ai-mentor-ingestion-failures
        title: "Ingestion Failures (>3 in 15m)"
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: loki
            model:
              expr: 'sum(count_over_time({container="/ai-mentor-api-1"} | json | event =~ "Ingestion failed|URL ingestion failed|PDF conversion failed|Swagger conversion failed" [15m])) > 3'
              queryType: instant
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: "Multiple ingestion failures detected"
          description: "More than 3 document ingestion failures in the last 15 minutes."
        labels:
          severity: warning

      - uid: ai-mentor-chat-high-latency
        title: "Chat High Latency (p95 > 60s)"
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              expr: 'quantile_over_time(0.95, {container="/ai-mentor-api-1"} | json | event = "Chat message completed" | unwrap duration_ms [5m]) by () > 60000'
              queryType: instant
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "Chat response time p95 exceeds 60 seconds"
          description: "The 95th percentile chat response time has been above 60s for 5 minutes. Check Ollama performance."
        labels:
          severity: warning

      - uid: ai-mentor-chat-errors
        title: "Chat Errors (>5 in 15m)"
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: loki
            model:
              expr: 'sum(count_over_time({container="/ai-mentor-api-1"} | json | event = "Chat stream error" [15m])) > 5'
              queryType: instant
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: "Multiple chat errors detected"
          description: "More than 5 chat stream errors in the last 15 minutes."
        labels:
          severity: warning

      - uid: ai-mentor-ollama-down
        title: "Ollama Unreachable"
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              expr: 'sum(count_over_time({container="/ai-mentor-api-1"} | json | event =~ "Ollama unreachable|Ollama API error" [5m])) > 2'
              queryType: instant
        noDataState: OK
        execErrState: Error
        for: 2m
        annotations:
          summary: "Ollama LLM server appears unreachable"
          description: "Multiple Ollama connection failures detected in the last 5 minutes."
        labels:
          severity: critical

      - uid: ai-mentor-s3-write-failures
        title: "S3 Write Failures (>3 in 5m)"
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              expr: 'sum(count_over_time({container=~"/ai-mentor-worker.*"} | json | event = "S3 write failed" [5m])) > 3'
              queryType: instant
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: "MinIO/S3 write failures detected"
          description: "More than 3 S3 write failures in 5 minutes. Storage may be degraded — check MinIO health (disk space, drives)."
        labels:
          severity: critical

      - uid: ai-mentor-s3-health-probe
        title: "MinIO Unhealthy (write probe failed)"
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              expr: 'count_over_time({container=~"/ai-mentor-worker.*"} | json | event = "S3 health probe FAILED" [5m]) > 2'
              queryType: instant
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: "MinIO storage is NOT writable — admin intervention required"
          description: "The periodic S3 write probe has failed multiple times. MinIO may have degraded drives or insufficient disk space."
        labels:
          severity: critical
