# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name lexiro.io www.lexiro.io;
    return 301 https://lexiro.io$request_uri;
}

# Redirect www → non-www over HTTPS
server {
    listen 443 ssl http2;
    server_name www.lexiro.io;

    ssl_certificate     /etc/nginx/ssl/lexiro.io.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/lexiro.io.key;

    return 301 https://lexiro.io$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    server_name lexiro.io;
    root /usr/share/nginx/html;
    index index.html;

    # SSL
    ssl_certificate     /etc/nginx/ssl/lexiro.io.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/lexiro.io.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Docker embedded DNS — re-resolve backend IP every 10s
    resolver 127.0.0.11 valid=10s;
    set $backend http://api:8000;

    # TUS resumable uploads — no body size limit, no buffering
    location /api/v1/uploads {
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /api/ {
        client_max_body_size 400m;
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE support
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
    }

    # MCP (Model Context Protocol) endpoint — proxied to backend
    location /mcp {
        proxy_pass $backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_set_header Connection '';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# Fallback: direct IP access → redirect to domain
server {
    listen 80 default_server;
    listen 443 ssl default_server http2;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/lexiro.io.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/lexiro.io.key;

    return 301 https://lexiro.io$request_uri;
}
